<section id="contact" class="py-20 md:py-24">
  <div class="max-w-6xl mx-auto px-6">
    <div class="rounded-2xl border border-line bg-surface p-8 md:p-12 flex flex-col md:flex-row md:items-center md:justify-between gap-8">
      <div class="space-y-3">
        <h2 class="section-title">{{ T "contact_title" }}</h2>
        <p class="text-ink-2 max-w-2xl">{{ T "contact_body" }}</p>
      </div>
      <a href="mailto:{{ .Site.Params.links.email }}" class="btn btn-primary shrink-0">
        <i data-lucide="mail" class="w-4 h-4"></i>
        <span>{{ T "contact_primary_cta" }}</span>
      </a>
      <!--TODO: Unnecesary repeat, search another alternative contact-->
    </div>
  </div>
</section>
