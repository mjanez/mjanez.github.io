<section id="stack" class="py-20 md:py-24">
  <div class="max-w-6xl mx-auto px-6 space-y-12">
    <div class="space-y-3">
      <h2 class="section-title">{{ T "stack_title" }}</h2>
      <p class="text-ink-2 max-w-2xl">{{ T "stack_subtitle" }}</p>
    </div>

    <div data-tabs class="grid lg:grid-cols-[18rem_1fr] gap-6">
      <div role="tablist" aria-orientation="vertical" class="flex lg:flex-col gap-2 overflow-x-auto scrollbar-hide">
        {{ range $i, $c := .Site.Data.stack.categories }}
        <button type="button" role="tab" id="stack-tab-{{ $i }}" aria-controls="stack-panel-{{ $i }}" aria-selected="{{ if eq $i 0 }}true{{ else }}false{{ end }}"{{ if ne $i 0 }} tabindex="-1"{{ end }} class="group shrink-0 flex items-center gap-3 rounded-xl border border-transparent px-4 py-3 text-left transition-colors hover:bg-raised aria-selected:border-line aria-selected:bg-surface">
          <i data-lucide="{{ $c.icon | default "layers" }}" class="w-4 h-4 shrink-0 text-ink-3 transition-colors group-aria-selected:text-accent-ink"></i>
          <span class="min-w-0 flex-1">
            <span class="block text-sm font-medium text-ink">{{ T $c.title_key }}</span>
            {{ with $c.subtitle_key }}<span class="hidden lg:block text-xs text-ink-3">{{ T . }}</span>{{ end }}
          </span>
          <span class="font-mono text-xs text-ink-3 tabular">{{ printf "%02d" (len $c.items) }}</span>
        </button>
        {{ end }}
      </div>

      <div>
        {{ range $i, $c := .Site.Data.stack.categories }}
        <div role="tabpanel" id="stack-panel-{{ $i }}" aria-labelledby="stack-tab-{{ $i }}" tabindex="0"{{ if ne $i 0 }} hidden{{ end }} class="rise rounded-xl border border-line bg-surface p-6 md:p-8">
          <ul class="divide-y divide-line">
            {{ range $c.items }}
            <li class="py-4 first:pt-0 last:pb-0 flex flex-wrap items-center gap-2">
              {{ range split (T .) " / " }}
              <span class="inline-flex items-center rounded-lg border border-line bg-canvas px-3 py-1.5 font-mono text-sm text-ink">{{ . }}</span>
              {{ end }}
            </li>
            {{ end }}
          </ul>
        </div>
        {{ end }}
      </div>
    </div>
    <noscript><style>[role="tabpanel"][hidden]{display:block}</style></noscript>
  </div>
</section>
