<section data-nav="projects" id="dynamic-projects" class="py-20 md:py-24">
    <div class="max-w-6xl mx-auto px-6 space-y-12">
        <div class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
            <div class="space-y-3">
                <h2 class="section-title">{{ T "more_projects" }}</h2>
                <p class="text-ink-2 max-w-2xl">{{ T "more_projects_desc" }}</p>
            </div>
            <div class="flex gap-2 self-start md:self-end">
                <button type="button" data-scroll-control="prev" aria-label='{{ T "dynamic_projects_scroll_prev" }}' class="h-8 w-8 inline-flex items-center justify-center rounded-lg border border-line text-ink-2 transition-colors hover:bg-raised hover:text-ink disabled:opacity-30 disabled:pointer-events-none">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
                <button type="button" data-scroll-control="next" aria-label='{{ T "dynamic_projects_scroll_next" }}' class="h-8 w-8 inline-flex items-center justify-center rounded-lg border border-line text-ink-2 transition-colors hover:bg-raised hover:text-ink disabled:opacity-30 disabled:pointer-events-none">
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <div class="space-y-6">
            <div class="h-1 rounded-full bg-raised overflow-hidden">
                <span data-scroll-progress role="progressbar" aria-label='{{ T "dynamic_projects_scroll_progress" }}' aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" class="block h-full w-0 bg-accent"></span>
            </div>

            <div id="github-projects-container" class="flex gap-6 overflow-x-auto snap-x snap-mandatory scrollbar-hide">
                <div class="snap-center shrink-0 w-[260px] sm:w-[320px] md:w-[360px] h-56 rounded-xl border border-dashed border-line flex items-center justify-center text-center">
                    <div class="flex flex-col items-center gap-3 text-ink-3">
                        <div class="w-6 h-6 border-2 border-ink-3 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-sm">{{ T "dynamic_projects_loading" }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>    
    document.addEventListener('DOMContentLoaded', function() {
        const copy = {
            loading: "{{ T "dynamic_projects_loading" }}",
            noResults: "{{ T "dynamic_projects_no_results" }}",
            noDescription: "{{ T "dynamic_projects_no_description" }}",
            languageFallback: "{{ T "dynamic_projects_language_fallback" }}",
            ctaLive: "{{ T "dynamic_projects_cta_live" }}",
            ctaCode: "{{ T "dynamic_projects_cta_code" }}",
            errorMessage: "{{ T "dynamic_projects_error_message" }}",
            errorLink: "{{ T "dynamic_projects_error_link" }}",
            invalidList: "{{ T "dynamic_projects_invalid_list" }}",
            apiError: "{{ T "dynamic_projects_api_error" }}",
            forks: "{{ T "dynamic_projects_forks_label" }}"
        };

        const githubUsername = '{{ .Site.Params.github.username }}';
        const excludedRepos = new Set({{ .Site.Params.github.excluded_repos | jsonify | safeJS }}.map(name => name.toLowerCase()));
        const container = document.getElementById('github-projects-container');
        const scrollButtons = document.querySelectorAll('[data-scroll-control]');
        const scrollProgress = document.querySelector('[data-scroll-progress]');
        let updateScrollState = null;

        if (!container) {
            console.error('[dynamic-projects] Container not found');
            return;
        }

        const enhanceScrollUi = () => {
            const update = () => {
                if (!scrollProgress) {
                    return;
                }
                const maxScroll = Math.max(container.scrollWidth - container.clientWidth, 0);
                const ratio = maxScroll === 0 ? 1 : container.scrollLeft / maxScroll;
                const clamped = Math.max(0, Math.min(1, ratio));
                scrollProgress.style.width = (clamped * 100) + '%';
                scrollProgress.setAttribute('aria-valuenow', String(Math.round(clamped * 100)));

                scrollButtons.forEach((button) => {
                    const direction = button.dataset.scrollControl;
                    if (!direction) {
                        return;
                    }
                    const disablePrev = clamped <= 0.01;
                    const disableNext = clamped >= 0.99;
                    const shouldDisable = maxScroll === 0 || (direction === 'prev' ? disablePrev : disableNext);
                    button.disabled = shouldDisable;
                });
            };

            const scrollByStep = (direction) => {
                const step = Math.max(container.clientWidth * 0.85, 280);
                container.scrollBy({ left: direction * step, behavior: 'smooth' });
            };

            scrollButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    const direction = button.dataset.scrollControl === 'next' ? 1 : -1;
                    scrollByStep(direction);
                });
            });

            container.addEventListener('scroll', update);
            window.addEventListener('resize', update);

            update();
            updateScrollState = update;
        };

        enhanceScrollUi();

        const refreshScrollUi = () => {
            if (typeof updateScrollState === 'function') {
                requestAnimationFrame(updateScrollState);
            }
        };

        window.githubRepos
            .then(repos => {
                if (!Array.isArray(repos)) {
                    throw new Error(copy.invalidList);
                }

                // FILTRADO
                const filteredRepos = repos.filter(repo => {
                    if (!repo || repo.private || repo.archived || repo.disabled) {
                        return false;
                    }
                    const repoName = (repo.name || '').toLowerCase();
                    if (excludedRepos.has(repoName)) {
                        return false;
                    }
                    return true;
                });

                if (filteredRepos.length === 0) {
                    container.innerHTML = `<div class="snap-center shrink-0 w-full p-10 text-center text-ink-3 border border-dashed border-line rounded-xl">${copy.noResults}</div>`;
                    refreshScrollUi();
                    return;
                }

                // ORDENACIÓN: Por forks_count DESC, luego por updated_at DESC
                filteredRepos.sort((a, b) => {
                    const aForks = a.forks_count || 0;
                    const bForks = b.forks_count || 0;
                    
                    if (bForks !== aForks) {
                        return bForks - aForks;
                    }
                    
                    const aDate = Date.parse(a.updated_at) || 0;
                    const bDate = Date.parse(b.updated_at) || 0;
                    return bDate - aDate;
                });

                container.innerHTML = '';

                filteredRepos.forEach(repo => {
                    const hasPages = repo.has_pages;
                    const homepage = (repo.homepage || '').trim();
                    let projectUrl = repo.html_url;
                    let isLive = false;

                    if (homepage.length > 0) {
                        projectUrl = homepage;
                        isLive = true;
                    } else if (hasPages) {
                        projectUrl = 'https://' + githubUsername + '.github.io/' + repo.name;
                        isLive = true;
                    }
                    
                    const forksCount = repo.forks_count || 0;
                    const language = repo.language || copy.languageFallback;

                    const card = document.createElement('div');
                    card.className = 'snap-center shrink-0 w-[260px] sm:w-[320px] md:w-[360px] flex flex-col rounded-xl border border-line bg-surface transition-colors hover:border-ink/20';

                    card.innerHTML = `
                        <div class="p-6 flex flex-col h-full gap-3">
                            <div class="flex justify-between items-center text-ink-3">
                                <i data-lucide="${isLive ? 'globe' : 'git-branch'}" class="w-5 h-5"></i>
                                <div class="flex items-center gap-1 font-mono text-xs tabular" title="${copy.forks}">
                                    <i data-lucide="git-fork" class="w-4 h-4"></i>
                                    <span>${forksCount}</span>
                                </div>
                            </div>

                            <h3 class="text-lg font-medium text-ink line-clamp-1" title="${repo.name}">${repo.name}</h3>

                            <p class="text-sm leading-6 text-ink-2 line-clamp-3 flex-grow">${repo.description || copy.noDescription}</p>

                            <div class="mt-auto pt-4 border-t border-line flex items-center justify-between gap-2">
                                <span class="font-mono text-xs text-ink-3">${language}</span>
                                <div class="flex items-center gap-4 text-sm text-ink-2">
                                    <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 transition-colors hover:text-ink">
                                        <i data-lucide="github" class="w-4 h-4"></i>
                                        <span>${copy.ctaCode}</span>
                                    </a>
                                    ${isLive ? `<a href="${projectUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 transition-colors hover:text-ink">
                                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                                        <span>${copy.ctaLive}</span>
                                    </a>` : ''}
                                </div>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });

                refreshScrollUi();

                if (window.lucide) {
                    window.lucide.createIcons();
                }
            })
            .catch(error => {
                console.error('[dynamic-projects] error:', error);
                container.innerHTML = `
                    <div class="snap-center shrink-0 w-[260px] sm:w-[320px] md:w-[360px] flex flex-col justify-center items-center p-6 rounded-xl border border-dashed border-line text-center">
                        <i data-lucide="github" class="w-6 h-6 mb-3 text-ink-3"></i>
                        <p class="text-sm text-ink-2 mb-2">${copy.errorMessage}</p>
                        <a href="https://github.com/${githubUsername}?tab=repositories" target="_blank" class="text-sm text-accent-ink hover:underline">${copy.errorLink}</a>
                    </div>
                `;
                refreshScrollUi();
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });
    });
</script>
