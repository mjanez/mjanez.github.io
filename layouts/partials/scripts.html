<script>
  (function() {
    const root = document.documentElement;
    const toggleBtn = document.getElementById('theme-toggle');
    const stored = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let theme = stored || (prefersDark ? 'dark' : 'light');

    const refreshThemeImages = () => {
      document.querySelectorAll('[data-theme-img]').forEach((img) => {
        const target = theme === 'dark' ? img.dataset.srcDark : img.dataset.srcLight;
        if (target && img.getAttribute('src') !== target) img.src = target;
      });
    };

    const applyTheme = () => {
      if (theme === 'dark') {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
      const sun = toggleBtn?.querySelector('.theme-icon-sun');
      const moon = toggleBtn?.querySelector('.theme-icon-moon');
      if (sun && moon) {
        sun.classList.toggle('hidden', theme === 'dark');
        moon.classList.toggle('hidden', theme !== 'dark');
      }
      refreshThemeImages();
    };

    applyTheme();

    toggleBtn?.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', theme);
      applyTheme();
    });

    const graphCanvas = document.getElementById('graph-bg');
    if (graphCanvas) {
      const ctx = graphCanvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const cssRgb = (name) => getComputedStyle(root).getPropertyValue(name).trim().replace(/\s+/g, ',');
      let ink, accent;
      const readColors = () => { ink = cssRgb('--ink'); accent = cssRgb('--accent'); };
      readColors();
      new MutationObserver(readColors).observe(root, { attributes: true, attributeFilter: ['class'] });

      const LINK = 200;
      const REACH = 200;
      const pointer = { x: -1e4, y: -1e4 };
      const nodes = Array.from({ length: 64 }, (_, i) => ({
        x: Math.random(),
        y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0004,
        vy: (Math.random() - 0.5) * 0.0004,
        r: i % 8 === 0 ? 3.5 : 2.5,
        key: i % 8 === 0,
      }));
      let w = 0;
      let h = 0;

      const resize = () => {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        graphCanvas.width = w * dpr;
        graphCanvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (reduceMotion) draw();
      };

      const draw = () => {
        ctx.clearRect(0, 0, w, h);
        for (const n of nodes) {
          if (!reduceMotion) {
            n.x += n.vx;
            n.y += n.vy;
            const dx = n.x * w - pointer.x;
            const dy = n.y * h - pointer.y;
            const d = Math.hypot(dx, dy);
            if (d < REACH && d > 0) {
              const push = (1 - d / REACH) * 0.6;
              n.x += (dx / d) * push / w;
              n.y += (dy / d) * push / h;
            }
          }
          if (n.x < 0 || n.x > 1) n.vx *= -1;
          if (n.y < 0 || n.y > 1) n.vy *= -1;
          n.x = Math.min(1, Math.max(0, n.x));
          n.y = Math.min(1, Math.max(0, n.y));
        }

        ctx.lineWidth = 1;
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          const ax = a.x * w;
          const ay = a.y * h;
          for (let j = i + 1; j < nodes.length; j++) {
            const b = nodes[j];
            const d = Math.hypot(ax - b.x * w, ay - b.y * h);
            if (d < LINK) {
              ctx.strokeStyle = `rgba(${ink},${(1 - d / LINK) * 0.16})`;
              ctx.beginPath();
              ctx.moveTo(ax, ay);
              ctx.lineTo(b.x * w, b.y * h);
              ctx.stroke();
            }
          }
          const pd = Math.hypot(ax - pointer.x, ay - pointer.y);
          if (pd < REACH) {
            ctx.strokeStyle = `rgba(${accent},${(1 - pd / REACH) * 0.5})`;
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(pointer.x, pointer.y);
            ctx.stroke();
          }
        }
        for (const n of nodes) {
          ctx.fillStyle = n.key ? `rgb(${accent})` : `rgba(${ink},0.3)`;
          ctx.beginPath();
          ctx.arc(n.x * w, n.y * h, n.r, 0, Math.PI * 2);
          ctx.fill();
        }
      };

      const tick = () => {
        draw();
        requestAnimationFrame(tick);
      };

      resize();
      window.addEventListener('resize', resize);
      if (!reduceMotion) {
        window.addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
        document.addEventListener('pointerleave', () => { pointer.x = pointer.y = -1e4; });
        requestAnimationFrame(tick);
      }
    }

    document.querySelectorAll('[data-tabs]').forEach((group) => {
      const tabs = Array.from(group.querySelectorAll('[role="tab"]'));
      const select = (tab, focus) => {
        tabs.forEach((t) => {
          const on = t === tab;
          t.setAttribute('aria-selected', String(on));
          t.tabIndex = on ? 0 : -1;
          document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
        });
        if (focus) tab.focus();
      };
      tabs.forEach((tab, i) => {
        tab.addEventListener('click', () => select(tab));
        tab.addEventListener('keydown', (e) => {
          const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
          if (!step) return;
          e.preventDefault();
          select(tabs[(i + step + tabs.length) % tabs.length], true);
        });
      });
    });

    let activeHash = window.location.hash || '';

    const syncLangSwitchLinks = () => {
      const hash = activeHash || window.location.hash;
      document.querySelectorAll('[data-lang-base]').forEach((link) => {
        const base = link.getAttribute('data-lang-base') || link.href;
        const cleanBase = base.split('#')[0];
        link.href = hash ? `${cleanBase}${hash}` : cleanBase;
      });
    };

    syncLangSwitchLinks();
    window.addEventListener('hashchange', () => {
      activeHash = window.location.hash || '';
      syncLangSwitchLinks();
    });
    document.addEventListener('click', (event) => {
      const anchor = event.target.closest('a[href^="#"]');
      if (anchor) {
        const targetHash = anchor.getAttribute('href');
        if (targetHash && targetHash.startsWith('#')) {
          activeHash = targetHash;
        }
        requestAnimationFrame(syncLangSwitchLinks);
      }
    });

    const navLinks = Array.from(document.querySelectorAll('[data-nav-link]'));
    const progressLine = document.querySelector('[data-page-progress]');

    const setCurrentSection = (id) => {
      navLinks.forEach((link) => {
        if (link.dataset.navLink === id) link.setAttribute('aria-current', 'true');
        else link.removeAttribute('aria-current');
      });
    };

    let progressQueued = false;
    const updateProgress = () => {
      progressQueued = false;
      if (!progressLine) return;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progressLine.style.transform = `scaleX(${max > 0 ? Math.min(1, window.scrollY / max) : 0})`;
    };
    window.addEventListener('scroll', () => {
      if (progressQueued) return;
      progressQueued = true;
      requestAnimationFrame(updateProgress);
    }, { passive: true });
    window.addEventListener('resize', () => {
      updateProgress();
    });
    updateProgress();

    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            activeHash = `#${entry.target.id}`;
            syncLangSwitchLinks();
            setCurrentSection(entry.target.dataset.nav || entry.target.id);
          }
        });
      }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
      document.querySelectorAll('section[id]').forEach((section) => observer.observe(section));
    }

    const mobileToggle = document.getElementById('mobile-menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const mobileOpenLabel = mobileToggle?.dataset.openLabel;
    const mobileCloseLabel = mobileToggle?.dataset.closeLabel;

    const setMobileMenuState = (open) => {
      if (!mobileMenu || !mobileToggle) return;
      mobileMenu.classList.toggle('hidden', !open);
      mobileToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      const iconOpen = mobileToggle.querySelector('.mobile-menu-icon-open');
      const iconClose = mobileToggle.querySelector('.mobile-menu-icon-close');
      iconOpen?.classList.toggle('hidden', open);
      iconClose?.classList.toggle('hidden', !open);
      if (mobileOpenLabel && mobileCloseLabel) {
        mobileToggle.setAttribute('aria-label', open ? mobileCloseLabel : mobileOpenLabel);
      }
    };

    setMobileMenuState(false);

    mobileToggle?.addEventListener('click', () => {
      const isOpen = mobileMenu?.classList.contains('hidden') === false;
      setMobileMenuState(!isOpen);
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        setMobileMenuState(false);
      }
    });

    mobileMenu?.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => setMobileMenuState(false));
    });

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const countupEls = Array.from(document.querySelectorAll('[data-countup]'));

    const observeOnce = (elements, onEnter, options) => {
      if (!elements.length) return;
      if (!('IntersectionObserver' in window)) {
        elements.forEach(onEnter);
        return;
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            onEnter(entry.target);
            observer.unobserve(entry.target);
          }
        });
      }, options);

      elements.forEach((el) => observer.observe(el));
    };

    const runCountup = (el) => {
      if (!el || el.dataset.counted === 'true') return;
      const start = Number(el.dataset.countStart);
      const end = Number(el.dataset.countEnd);
      if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) return;
      el.dataset.counted = 'true';

      if (prefersReducedMotion || start === end) {
        el.textContent = String(end);
        return;
      }

      const duration = 900;
      const startTime = performance.now();
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);

      const step = (now) => {
        const progress = Math.min(1, (now - startTime) / duration);
        const value = Math.round(start + (end - start) * easeOut(progress));
        el.textContent = String(value);
        if (progress < 1) requestAnimationFrame(step);
      };

      requestAnimationFrame(step);
    };

    observeOnce(countupEls, runCountup, { threshold: 0.6 });

    const ensureLucide = (attempt = 0) => {
      if (window.lucide?.createIcons) {
        window.lucide.createIcons();
        return;
      }
      if (attempt < 80) {
        requestAnimationFrame(() => ensureLucide(attempt + 1));
      }
    };

    ensureLucide();
  })();
</script>
