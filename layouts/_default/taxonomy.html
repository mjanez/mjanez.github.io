<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" class="scroll-smooth">
{{ partial "head.html" . }}
<body class="min-h-screen">
  <canvas id="graph-bg" class="fixed inset-0 -z-10 pointer-events-none" aria-hidden="true"></canvas>

    {{ partial "nav.html" . }}
    <main id="main" class="max-w-6xl mx-auto px-6 py-16">
      <h1 class="section-title mb-8">{{ .Title }}</h1>
      <div class="grid gap-4">
        {{ range .Pages }}
          <a href="{{ .RelPermalink }}" class="rounded-xl border border-line bg-surface px-4 py-3 flex items-center justify-between transition-colors hover:border-ink/20">
            <span class="font-medium">{{ .Title }}</span>
            <span class="font-mono text-xs text-ink-3">{{ .Date.Format "2006-01-02" }}</span>
          </a>
        {{ end }}
      </div>
    </main>
    {{ partial "footer.html" . }}

  {{ partial "scripts.html" . }}
</body>
</html>
